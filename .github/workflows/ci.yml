name: ci

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs-check:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA")
          if [ -z "$files" ]; then
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r file; do
            case "$file" in
              *.md|*.mdx|*.rst|*.txt|*.adoc) ;;
              *)
                echo 'docs_only=false' >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done <<< "$files"
          echo 'docs_only=true' >> "$GITHUB_OUTPUT"

  verify:
    needs: [docs-check]
    if: (github.event_name != 'push' || github.ref != 'refs/heads/main') &&
      (github.event_name != 'pull_request' || needs.docs-check.outputs.docs_only != 'true')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: hail-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: jdx/mise-action@v3
      - name: Install pinned dependencies
        run: |
          pnpm --dir vendor/did-method-plc install --frozen-lockfile
          pnpm --dir vendor/did-method-plc --filter @did-plc/lib build
          bun install --frozen-lockfile
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Verify workspace
        run: |
          bun run typecheck
          bun run test
          bun run build
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          driver-opts: |
            memory=4g
            memory-swap=4g
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: Verify images
        run: |
          docker buildx build --load -t hail-provider:ci -f apps/server/Dockerfile .
          docker buildx build --load -t hail-web-client:ci -f apps/client/Dockerfile .
          docker run --rm --entrypoint sh hail-provider:ci -c 'test ! -d /workspace/hail/apps/client && test -f src/cli/provider-operator.ts && test -f src/cli/create-signup-invitation.ts'
          docker buildx build --load -f apps/plc-monitor/Dockerfile .
      - name: Verify independent provider and optional web-client deployment
        run: python3 scripts/check-independent-deployment.py
      - name: Verify browser recovery cryptography and wizard
        env:
          CHROMIUM: google-chrome
          OPENCODE_TMP_DIR: ${{ runner.temp }}
        run: |
          bun run --cwd apps/client test:browser
          bun run --cwd apps/client test:wizard
          bun run --cwd apps/client test:conversations
      - name: Verify native CLI
        working-directory: apps/cli
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --release --locked
          bun tests/compatibility.ts target/release/racr
          bun tests/vault-compatibility.ts target/release/racr
          bun tests/transfer-e2e.ts target/release/racr
          python3 tests/terminal-input.py target/release/racr
          bun scripts/smoke.ts target/release/racr
          python3 scripts/verify-install.py
          python3 scripts/generate-reference.py --check
          python3 scripts/check-release.py --binary target/release/racr
      - name: Verify database integration (no skipped tests)
        env:
          DATABASE_TEST_ADMIN_URL: postgresql://postgres:hail-test-only@127.0.0.1:5432/postgres
        run: |
          bun scripts/export-account-history-schema.ts --check
          bun scripts/test-database-integration.ts

  verify-main:
    name: verify-main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docs-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Reuse successful PR verification for the exact merged tree
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repository = `${owner}/${repo}`;
            const mainSha = context.sha;
            const associated = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {owner, repo, commit_sha: mainSha, per_page: 100});
            const pull = associated.find(candidate => candidate.merged_at &&
              candidate.base.ref === 'main' && candidate.merge_commit_sha === mainSha);
            if (!pull) {
              core.setFailed(`No merged PR into main is associated with ${mainSha}.`);
              return;
            }

            const [mainCommit, testedCommit] = await Promise.all([
              github.rest.repos.getCommit({owner, repo, ref: mainSha}),
              github.rest.repos.getCommit({owner, repo, ref: pull.head.sha}),
            ]);
            const mainTree = mainCommit.data.commit.tree.sha;
            const testedTree = testedCommit.data.commit.tree.sha;
            if (mainTree !== testedTree) {
              core.setFailed(`Merged commit tree ${mainTree} differs from PR head tree ${testedTree}.`);
              return;
            }

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'ci.yml', event: 'pull_request',
              head_sha: pull.head.sha, per_page: 100,
            });
            const priorRuns = runs.filter(run => run.head_sha === pull.head.sha &&
              run.head_branch === pull.head.ref &&
              run.head_repository?.full_name === pull.head.repo?.full_name &&
              run.status === 'completed' &&
              Date.parse(run.updated_at) <= Date.parse(pull.merged_at))
              .sort((a, b) => Date.parse(b.updated_at) - Date.parse(a.updated_at));
            const run = priorRuns[0];
            if (!run || run.status !== 'completed' || run.conclusion !== 'success') {
              core.setFailed(`No successful PR CI run for ${pull.head.sha} completed before merge.`);
              return;
            }

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: run.id, per_page: 100,
            });
            const verify = jobs.find(job => job.name === 'verify');
            if (verify?.conclusion !== 'success') {
              const docsCheck = jobs.find(job => job.name === 'docs-check');
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: pull.number, per_page: 100,
              });
              const isDocumentation = path => ['.md', '.mdx', '.rst', '.txt', '.adoc']
                .some(extension => path.endsWith(extension));
              const docsOnly = files.length > 0 && files.every(file =>
                isDocumentation(file.filename) &&
                (!file.previous_filename || isDocumentation(file.previous_filename))) &&
                files.length === pull.changed_files;
              if (verify?.conclusion !== 'skipped' || docsCheck?.conclusion !== 'success' || !docsOnly) {
                core.setFailed(`PR CI run ${run.html_url} did not complete the required verify job.`);
                return;
              }
            }

            core.info(`Reused successful PR CI ${run.html_url} for merged tree ${mainTree}.`);
            await core.summary
              .addHeading('Reused PR verification')
              .addLink(`PR #${pull.number}`, pull.html_url)
              .addRaw(' · ')
              .addLink('Successful CI run', run.html_url)
              .addRaw(`\n\nMain commit: \`${mainSha}\`\n\nVerified tree: \`${mainTree}\``)
              .write();
