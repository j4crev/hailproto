name: Publish provider and web-client images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Require successful main verification for this exact commit
        uses: actions/github-script@v8
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo,
              workflow_id: 'ci.yml',
              branch: 'main',
              event: 'push',
              head_sha: context.sha,
              per_page: 100,
            });
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const run = runs
              .filter(run => run.head_sha === context.sha &&
                run.head_branch === 'main' && run.event === 'push' &&
                run.head_repository?.full_name === repository)
              .sort((a, b) => b.id - a.id)[0];
            if (!run || run.status !== 'completed' || run.conclusion !== 'success') {
              core.setFailed(`Publication requires successful main CI verification for ${context.sha}. ` +
                (run ? `Latest run: ${run.html_url} (${run.status}/${run.conclusion}). ` : 'No matching CI run found. ') +
                'Wait for CI to succeed, then rerun publication.');
              return;
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id: run.id, per_page: 100,
            });
            const verification = jobs.find(job => job.name === 'verify-main');
            if (verification?.conclusion !== 'success') {
              core.setFailed(`Publication requires a successful verify-main handoff for ${context.sha}. ` +
                (verification ? `Job conclusion: ${verification.conclusion}. ` : 'No verify-main job found. ') +
                'Wait for CI to succeed, then rerun publication.');
              return;
            }
            core.info(`Using successful CI: ${run.html_url} (attempt ${run.run_attempt})`);
            await core.summary
              .addHeading('Verified merged PR CI')
              .addLink(`Main verification for ${context.sha} (attempt ${run.run_attempt})`, run.html_url)
              .write();

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          driver-opts: |
            memory=4g
            memory-swap=4g
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select image repository
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}/provider" >> "$GITHUB_OUTPUT"
      - name: Build and publish provider image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=provider
          cache-to: type=gha,mode=max,scope=provider
      - name: Build and publish web-client image
        id: client
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/client/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}-web-client:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=web-client
          cache-to: type=gha,mode=max,scope=web-client
      - name: Record immutable deployment reference
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          CLIENT_IMAGE: ${{ steps.image.outputs.name }}-web-client@${{ steps.client.outputs.digest }}
          COMMIT: ${{ github.sha }}
        run: |
          printf 'Commit: `%s`\n\nProvider: `%s`\n\nWeb client: `%s`\n\n' "$COMMIT" "$IMAGE" "$CLIENT_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          printf 'hail-provider-ops deploy %s %s %s\n' "$COMMIT" "$IMAGE" "$CLIENT_IMAGE" > provider-release.txt
          cat provider-release.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: provider-release
          path: provider-release.txt
