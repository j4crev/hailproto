name: Publish provider image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          driver-opts: |
            memory=4g
            memory-swap=4g
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select image repository
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}/provider" >> "$GITHUB_OUTPUT"
      - name: Build and publish provider and GUI image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=provider
          cache-to: type=gha,mode=max,scope=provider
      - name: Record immutable deployment reference
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          COMMIT: ${{ github.sha }}
        run: |
          printf 'Commit: `%s`\n\nImage: `%s`\n\n' "$COMMIT" "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
          printf 'hail-provider-ops deploy %s %s\n' "$COMMIT" "$IMAGE" > provider-release.txt
          cat provider-release.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: provider-release
          path: provider-release.txt
