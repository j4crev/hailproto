name: release-linux

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  build:
    needs: verify
    # Ubuntu 22.04 / glibc 2.35 is the oldest qualified runtime.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 26.7.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - name: Build pinned libraries
        run: |
          pnpm --dir vendor/did-method-plc install --frozen-lockfile
          pnpm --dir vendor/did-method-plc --filter @did-plc/lib build
          bun install --frozen-lockfile
          bun run --cwd packages/hail-codec-ts build
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Verify native CLI parity
        working-directory: apps/cli
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --release --locked
          bun tests/compatibility.ts target/release/hailp
          bun tests/vault-compatibility.ts target/release/hailp
          bun tests/transfer-e2e.ts target/release/hailp
          python3 tests/terminal-input.py target/release/hailp
          python3 scripts/verify-install.py
      - name: Build and verify hailp
        working-directory: apps/cli
        run: |
          bun run build
          bun run smoke -- dist/hailp
      - name: Package
        working-directory: apps/cli
        run: |
          version=$(bun -e 'console.log(require("./package.json").version)')
          python3 scripts/generate-reference.py --check
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            python3 scripts/check-release.py --binary dist/hailp --tag "$GITHUB_REF_NAME"
          else
            python3 scripts/check-release.py --binary dist/hailp
          fi
          tar -C dist -czf "hailp-$version-linux-x64.tar.gz" hailp
          sha256sum "hailp-$version-linux-x64.tar.gz" > "hailp-$version-linux-x64.tar.gz.sha256"
      - name: Test packaged artifact on clean supported Linux runtimes
        working-directory: apps/cli
        run: |
          version=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          for distribution in ubuntu:22.04 ubuntu:24.04; do
            docker run --rm --platform linux/amd64 \
              -v "$PWD:/release:ro" "$distribution" sh -ec '
                apt-get update -qq
                apt-get install -y -qq --no-install-recommends python3 ca-certificates openssl
                python3 /release/scripts/verify-artifact.py "/release/hailp-$1-linux-x64.tar.gz" "$1"
              ' sh "$version"
          done
      - name: Attest release archive
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: apps/cli/hailp-*-linux-x64.tar.gz
      - name: Retain and verify provenance
        working-directory: apps/cli
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          archive="hailp-$version-linux-x64.tar.gz"
          cp "$BUNDLE" "$archive.sigstore.json"
          gh attestation verify "$archive" --bundle "$archive.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-linux.yml" \
            --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners
      - uses: actions/upload-artifact@v5
        with:
          name: hailp-linux-x64
          path: |
            apps/cli/hailp-*-linux-x64.tar.gz
            apps/cli/hailp-*-linux-x64.tar.gz.sha256
            apps/cli/hailp-*-linux-x64.tar.gz.sigstore.json
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        working-directory: apps/cli
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" hailp-*-linux-x64.tar.gz hailp-*-linux-x64.tar.gz.sha256 hailp-*-linux-x64.tar.gz.sigstore.json --verify-tag --generate-notes --prerelease
