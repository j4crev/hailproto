name: hail-public-monitor

services:
  db:
    image: postgres:14.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: ${MONITOR_DB_PASSWORD:?set MONITOR_DB_PASSWORD}
      POSTGRES_DB: monitor
    volumes:
      - monitor_db:/var/lib/postgresql/data
    networks: [storage]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U monitor -d monitor]
      interval: 5s
      timeout: 5s
      retries: 12

  monitor:
    image: hail-plc-monitor-ts:public
    build:
      context: ../../..
      dockerfile: hail-plc-monitor-ts/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      DATABASE_URL: postgresql://monitor:${MONITOR_DB_PASSWORD:?set MONITOR_DB_PASSWORD}@db:5432/monitor
      PLC_DIRECTORY_URL: https://plc.directory
      MONITOR_PRIVATE_KEY_FILE: /run/monitor/monitor.pkcs8
      MONITOR_ORIGIN: ${MONITOR_ORIGIN:?set MONITOR_ORIGIN}
      MONITOR_DEPLOYMENT_PROFILE: provider-bootstrap-public
    volumes:
      - ./secrets:/run/monitor:ro
      - ./reviewed:/reviewed:ro
    networks: [storage, egress]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "import {SQL} from 'bun'; const sql=new SQL(process.env.DATABASE_URL); const r=await sql`SELECT last_healthy_at FROM monitor_cursor WHERE singleton=true`; await sql.close(); process.exit(r[0]?.last_healthy_at && Date.now()-new Date(r[0].last_healthy_at).getTime()<300000?0:1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  storage:
    internal: true
  egress:

volumes:
  monitor_db:
